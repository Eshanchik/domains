---
# Кладётся в репозиторий приложения как .github/workflows/build.yml,
# ЗАМЕНЯЯ существующий deploy.yml.
#
# Файл одинаков для всех приложений — меняется ровно одна строка, APP ниже.
# Отдельного репозитория с reusable workflow намеренно нет: логики здесь мало,
# репозитории приложений имеют разную видимость (публичный и приватный), а
# общий файл с @main означал бы, что правка в одном месте молча меняет сборку
# везде. Сорок строк в двух местах дешевле этой связанности.
#
# Что делает: собирает один образ и пушит в GHCR. НА СЕРВЕР НЕ ХОДИТ.
# Выкатку запускает человек в Semaphore, выбирая тег.
#
# Секреты не нужны: GITHUB_TOKEN выдаётся автоматически и его достаточно.
# Старые секреты (KOMODO_WEBHOOK_SECRET, DEPLOY_SSH_KEY, DEPLOY_HOST,
# DEPLOY_USER) после перехода надо удалить — неиспользуемый ключ это ключ.

name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  # ЕДИНСТВЕННОЕ, что меняется между репозиториями.
  # Должно совпадать с `id` в managed_apps ops-репозитория — это же имя
  # образа в GHCR и каталог /srv/apps/<APP> на сервере.
  APP: domains

jobs:
  # Тесты гейтят сборку: образ, проваливший свои тесты, не должен попадать
  # в реестр, откуда его можно выбрать в Semaphore.
  # Требует `on: workflow_call` в ci.yml этого репозитория.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Теги:
      #   основная ветка -> latest
      #   любая ветка    -> имя ветки
      # Оба ИЗМЕНЯЕМЫЕ: новая сборка той же ветки перезаписывает тег. Слэш в
      # имени ветки превращается в дефис — feature/x пушится как feature-x,
      # именно это имя и надо вводить в Semaphore.
      #
      # Идентифицировать развёрнутое по тегу поэтому нельзя; app_base пишет
      # digest образа в /srv/apps/<APP>/DEPLOYED, и откат возможен по нему,
      # пока прежний образ не вычищен как dangling (примерно неделя).
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Владелец в нижнем регистре: GHCR отвергает пути со смешанным.
          images: ghcr.io/eshanchik/${{ env.APP }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report what was pushed
        run: |
          {
            echo "### Образы в GHCR"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Задеплоить: Semaphore -> Deploy ${APP} -> выбрать тег."
          } >> "${GITHUB_STEP_SUMMARY}"
