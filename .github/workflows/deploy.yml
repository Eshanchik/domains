# Кладётся в репозиторий Eshanchik/domains как .github/workflows/deploy.yml.
# Это НОВЫЙ файл: раньше деплоя через CI не было вовсе — сервис обновлялся
# вручную через `git pull` в /opt/domainguard на 64.226.118.46.
#
# Один образ обслуживает все пять ролей (api, worker, scheduler, mcp, migrate);
# роль задаётся аргументом команды в compose, поэтому собирается он ровно один раз.
#
# Секреты репозитория:
#   KOMODO_WEBHOOK_SECRET — берётся с сервера:
#     ssh deploy@141.95.34.21 'sudo grep KOMODO_WEBHOOK_SECRET /opt/stacks/komodo/.env'
#
# Внимание: репозиторий публичный, а пакет в GHCR по умолчанию наследует
# видимость. Секретов в образе нет (они приходят через .env), но если хочешь
# закрыть образ — переключи видимость пакета в Private после первой сборки,
# тогда Komodo будет тянуть его через Registry Account.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/eshanchik/domains
  KOMODO_STACK: domainguard

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Триггер деплоя в Komodo
        env:
          SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          url="https://komodo.zimbabwe-inc.com/listener/github/stack/${KOMODO_STACK}/deploy"
          body="$(jq -nc --arg ref "${{ github.ref }}" '{ref: $ref}')"
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $2}')"
          curl -fsS -X POST "$url" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $sig" \
            --data "$body"

      - name: Проверить, что сервис жив
        # Деплой включает прогон миграций (одноразовый контейнер migrate),
        # поэтому запас по времени больше, чем у обычного сервиса.
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://domains.zimbabwe-inc.com/healthz || true)
            [ "$code" = "200" ] && { echo "ok"; exit 0; }
            sleep 5
          done
          echo "Проверка здоровья не прошла за 200 секунд" >&2
          exit 1

# Примечание: ci.yml в этом репозитории не объявляет workflow_call, поэтому
# переиспользовать его как `uses:` нельзя — он запускается сам по себе на push.
# Если захочешь блокировать деплой при падении тестов, добавь в ci.yml
# триггер `workflow_call:` и здесь появится `needs: test`.
