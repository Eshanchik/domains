name: deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: domainguard
          POSTGRES_PASSWORD: domainguard
          POSTGRES_DB: domainguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domainguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://domainguard:domainguard@localhost:5432/domainguard
      REDIS_URL: redis://localhost:6379/0
      DG_MASTER_KEY: 2f4lEgCux7eN2sivGri_2plV3lhH3soDWV4g2PwwwGk=
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest

  build:
    # Build and publish the image only on main, after lint + tests pass.
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image metadata
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Trigger Komodo to `compose pull && up -d`. No SSH/keys — just a webhook.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komodo redeploy
        env:
          KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
        run: |
          if [ -z "$KOMODO_WEBHOOK_URL" ]; then
            echo "KOMODO_WEBHOOK_URL is not set yet — skipping deploy trigger (not a failure)."
            exit 0
          fi
          # Komodo stack webhook: POST to /listener/<github|gitlab>/stack/<id>/<deploy|refresh>.
          # If the stack's webhook has a secret configured, Komodo also expects an
          # X-Hub-Signature-256 header — add it here (HMAC-SHA256 of the body) if needed.
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            "$KOMODO_WEBHOOK_URL"
